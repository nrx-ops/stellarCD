{{- if and .Values.rbac.create .Values.controller.leaderElection.enabled }}
{{/*
Leader election is namespace-scoped: the Lease object lives alongside the
manager, so a Role is enough here.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "stellarcd.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stellarcd.controller.labels" . | nindent 4 }}
  {{- with (include "stellarcd.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "stellarcd.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stellarcd.controller.labels" . | nindent 4 }}
  {{- with (include "stellarcd.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "stellarcd.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "stellarcd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
