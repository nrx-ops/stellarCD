{{- if and .Values.rbac.create .Values.controller.metrics.enabled .Values.controller.metrics.secure }}
{{/*
Secure metrics delegate authn/authz to the API server: every scrape is checked
with a TokenReview and a SubjectAccessReview, which is what these verbs are for.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellarcd.fullname" . }}-metrics-auth-role
  labels:
    {{- include "stellarcd.controller.labels" . | nindent 4 }}
  {{- with (include "stellarcd.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "stellarcd.fullname" . }}-metrics-auth-rolebinding
  labels:
    {{- include "stellarcd.controller.labels" . | nindent 4 }}
  {{- with (include "stellarcd.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "stellarcd.fullname" . }}-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: {{ include "stellarcd.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.rbac.create .Values.controller.metrics.enabled .Values.rbac.metricsReader.create }}
---
{{/*
Bind this to whichever identity scrapes the endpoint (e.g. the Prometheus
ServiceAccount). The chart intentionally creates no binding for it.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "stellarcd.fullname" . }}-metrics-reader
  labels:
    {{- include "stellarcd.controller.labels" . | nindent 4 }}
  {{- with (include "stellarcd.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
rules:
  - nonResourceURLs:
      - /metrics
    verbs:
      - get
{{- end }}
