---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: astrals.core.stellarcd.io
spec:
  group: core.stellarcd.io
  names:
    kind: Astral
    listKind: AstralList
    plural: astrals
    shortNames:
    - ast
    - astrals
    singular: astral
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.galaxyRef
      name: Galaxy
      type: string
    - jsonPath: .spec.vcsRepository.url
      name: Repository
      type: string
    - jsonPath: .spec.vcsRepository.path
      name: Path
      type: string
    - jsonPath: .status.syncStatus
      name: Sync
      type: string
    - jsonPath: .status.drift.toDestroy
      name: Destroy
      type: integer
    - jsonPath: .status.activeFlare
      name: Active
      type: string
    - jsonPath: .status.lastSuccessfulFlare
      name: Last Flare
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Astral is the Schema for the astrals API: one root module, one state, one
          plane of infrastructure that Flares illuminate.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AstralSpec defines the desired state of an Astral.

              An Astral is one Terraform/OpenTofu/Terragrunt root module: one directory,
              one workspace, one state. Every run against it is a Flare.
            properties:
              applyOnMerge:
                default: false
                description: ApplyOnMerge raises an Apply Flare when the tracked branch
                  moves.
                type: boolean
              autoApply:
                default: false
                description: AutoApply lets a successful Plan chain straight into
                  an Apply.
                type: boolean
              backendSecretRef:
                description: |-
                  BackendSecretRef names the Secret holding the state backend
                  credentials, e.g. GOOGLE_CREDENTIALS for GCS. Its keys become env vars
                  verbatim. It overrides the Galaxy's spec.backendConfig.secretRef.
                properties:
                  name:
                    description: Name is the name of the referenced Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              customHooks:
                description: CustomHooks are shell commands run around the engine
                  invocation.
                properties:
                  postApply:
                    description: PostApply runs after a successful "apply".
                    items:
                      type: string
                    type: array
                  postPlan:
                    description: PostPlan runs after a successful "plan".
                    items:
                      type: string
                    type: array
                  preApply:
                    description: PreApply runs before "apply".
                    items:
                      type: string
                    type: array
                  prePlan:
                    description: PrePlan runs before "plan".
                    items:
                      type: string
                    type: array
                type: object
              dependsOn:
                description: |-
                  DependsOn lists Astral names in the same namespace that must be Synced
                  before this one may run. Cycles are rejected by the validating webhook.
                items:
                  type: string
                type: array
              description:
                description: Description explains what this project provisions.
                maxLength: 1024
                type: string
              displayName:
                description: DisplayName is the human-readable project name shown
                  in the dashboard.
                maxLength: 128
                type: string
              driftDetection:
                description: |-
                  DriftDetection configures the periodic Plan Flares that keep syncStatus
                  and the drift counts current.
                properties:
                  enabled:
                    default: false
                    description: Enabled turns periodic drift detection on.
                    type: boolean
                  interval:
                    default: 1h
                    description: Interval is the delay between two drift checks.
                    type: string
                type: object
              enableLocking:
                default: true
                description: |-
                  EnableLocking passes -lock to the engine, so it takes the backend state
                  lock. It does not affect stellarCD's own rule of one active Flare per
                  Astral, which always applies. Turning it off is only safe for read-only
                  modules.
                type: boolean
              engine:
                default: Terraform
                description: Engine is the binary that runs init, plan and apply and
                  owns the state.
                enum:
                - Terraform
                - OpenTofu
                type: string
              engineVersion:
                description: |-
                  EngineVersion is the exact engine version, e.g. "1.16.6". Empty means the
                  version the runner image ships; a mismatch fails the Flare before init.
                pattern: ^$|^v?[0-9]+\.[0-9]+(\.[0-9]+)?$
                type: string
              galaxyRef:
                description: |-
                  GalaxyRef is the name of the owning Galaxy, resolved in the same
                  namespace as this Astral. Immutable.
                maxLength: 253
                minLength: 1
                type: string
              planOnPR:
                default: true
                description: PlanOnPR raises a Plan Flare when a pull request touches
                  spec.vcsRepository.path.
                type: boolean
              secrets:
                description: Secrets project Kubernetes Secrets into the executor
                  environment.
                items:
                  description: |-
                    EnvSecretRef projects a Secret into the executor environment. It is the only
                    supported way to pass sensitive Terraform inputs: values never transit
                    through the spec, the status or the logs.
                  properties:
                    envPrefix:
                      default: TF_VAR_
                      description: |-
                        EnvPrefix is prepended to each projected key to build the environment
                        variable name. Terraform reads inputs from TF_VAR_<name>, hence the
                        default. Set it to "" for cloud credentials, which providers read under
                        their own names (AWS_ACCESS_KEY_ID, GOOGLE_CREDENTIALS, ...). It is a
                        pointer so that "" can be told apart from "not set".
                      type: string
                    key:
                      description: |-
                        Key selects a single entry from the Secret. When empty every key in the
                        Secret is projected.
                      type: string
                    name:
                      description: Name is the Secret name, resolved in the object's
                        own namespace.
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                type: array
              terragrunt:
                description: Terragrunt puts Terragrunt in front of the engine.
                properties:
                  enabled:
                    default: false
                    description: Enabled routes every command through Terragrunt.
                    type: boolean
                  excludedUnits:
                    description: |-
                      ExcludedUnits are skipped by whole-Astral runs in RunAll mode, typically
                      a unit that is broken and being fixed. Paths are relative to the Astral
                      path. They are never inherited.
                    items:
                      type: string
                    type: array
                  mode:
                    default: Unit
                    description: Mode selects a single unit or every unit below the
                      path.
                    enum:
                    - Unit
                    - RunAll
                    type: string
                  version:
                    description: |-
                      Version is the exact Terragrunt version, e.g. "1.1.6". Empty means the
                      version the runner image ships; a mismatch fails the Flare before init.
                    pattern: ^$|^v?[0-9]+\.[0-9]+(\.[0-9]+)?$
                    type: string
                type: object
              universeRef:
                description: UniverseRef is the name of the owning Universe. Immutable.
                maxLength: 253
                minLength: 1
                type: string
              variables:
                additionalProperties:
                  type: string
                description: |-
                  Variables are non-sensitive inputs passed as TF_VAR_<name>. Anything
                  secret belongs in spec.secrets instead.
                type: object
              vcsRepository:
                description: VCSRepository locates the root module.
                properties:
                  branch:
                    default: main
                    description: Branch is the tracked branch.
                    minLength: 1
                    type: string
                  path:
                    default: .
                    description: |-
                      Path is the directory inside the repository holding the root module.
                      Relative to the repository root; "." means the root itself.
                    type: string
                  provider:
                    default: GitHub
                    description: Provider identifies the hosting platform.
                    enum:
                    - GitHub
                    - GitLab
                    - Gitea
                    type: string
                  secretRef:
                    description: |-
                      SecretRef references the Secret holding the clone credentials. When unset
                      the Galaxy-level credentials are used.
                    properties:
                      name:
                        description: Name is the name of the referenced Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: URL is the clone URL, HTTPS or SSH.
                    minLength: 1
                    type: string
                required:
                - url
                type: object
              workspaceName:
                default: default
                description: WorkspaceName is the engine workspace selected before
                  every run.
                minLength: 1
                type: string
            required:
            - galaxyRef
            - universeRef
            - vcsRepository
            type: object
          status:
            description: AstralStatus reports the observed state of an Astral.
            properties:
              activeFlare:
                description: ActiveFlare is the Flare currently running against this
                  Astral, if any.
                type: string
              conditions:
                description: Conditions holds the machine-readable state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              drift:
                description: Drift records the outcome of the last plan.
                properties:
                  detected:
                    description: Detected is true while real infrastructure diverges
                      from the tracked revision.
                    type: boolean
                  lastChecked:
                    description: LastChecked is when the last drift check ran, drifted
                      or not.
                    format: date-time
                    type: string
                  lastDetected:
                    description: LastDetected is when drift was last observed.
                    format: date-time
                    type: string
                  toCreate:
                    description: ToCreate is the number of resources the plan adds.
                    format: int32
                    type: integer
                  toDestroy:
                    description: ToDestroy is the number of resources the plan deletes
                      outright.
                    format: int32
                    type: integer
                  toReplace:
                    description: ToReplace is the number of resources deleted and
                      recreated.
                    format: int32
                    type: integer
                  toUpdate:
                    description: ToUpdate is the number of resources changed in place.
                    format: int32
                    type: integer
                type: object
              flareHistory:
                description: FlareHistory keeps the most recent finished Flares, newest
                  first.
                items:
                  description: FlareRef is one entry of the rolling Flare history
                    kept on an Astral.
                  properties:
                    action:
                      description: Action is the action that Flare performed.
                      type: string
                    completionTime:
                      description: CompletionTime is when that Flare finished.
                      format: date-time
                      type: string
                    name:
                      description: Name is the Flare object name.
                      type: string
                    phase:
                      description: Phase is the terminal phase that Flare reached.
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 10
                type: array
              infrastructure:
                description: Infrastructure is the last known shape of the managed
                  resources.
                properties:
                  currency:
                    description: Currency is the ISO 4217 code for EstimatedMonthlyCost.
                    pattern: ^$|^[A-Z]{3}$
                    type: string
                  estimatedMonthlyCost:
                    description: |-
                      EstimatedMonthlyCost is a decimal amount, e.g. "412.50". It is a string
                      rather than a float because the Kubernetes API conventions rule out
                      floating point fields: they round-trip badly across clients.
                    pattern: ^$|^[0-9]+(\.[0-9]{1,2})?$
                    type: string
                  resourceCount:
                    description: ResourceCount is the number of resources in the state
                      file.
                    format: int32
                    type: integer
                type: object
              lastFlareRef:
                description: LastFlareRef is the most recent Flare that reached a
                  terminal phase.
                type: string
              lastFlareStatus:
                description: LastFlareStatus is the terminal phase of the most recent
                  Flare.
                enum:
                - Succeeded
                - Failed
                - Cancelled
                type: string
              lastSuccessfulFlare:
                description: LastSuccessfulFlare is the name of the last Flare that
                  succeeded.
                type: string
              lastSyncTime:
                description: LastSyncTime is when that apply finished.
                format: date-time
                type: string
              lastSyncedRevision:
                description: LastSyncedRevision is the commit last applied successfully
                  to the whole Astral.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last processed.
                format: int64
                type: integer
              syncStatus:
                description: |-
                  SyncStatus says whether real infrastructure matches the tracked revision.
                  It replaces the former phase, which mixed what is running with what the
                  result is: progress is now read from activeFlare, failures from the
                  Reconciled condition and lastFlareStatus. In RunAll mode it is the worst
                  status among the units.
                enum:
                - Synced
                - OutOfSync
                - Unknown
                type: string
              units:
                description: Units is the per-unit view, in RunAll mode only.
                items:
                  description: UnitStatus is the per-unit view of a RunAll Astral.
                  properties:
                    drift:
                      description: Drift is what the last plan would change in this
                        unit.
                      properties:
                        toCreate:
                          description: ToCreate is the number of resources the plan
                            adds.
                          format: int32
                          type: integer
                        toDestroy:
                          description: ToDestroy is the number of resources the plan
                            deletes outright.
                          format: int32
                          type: integer
                        toReplace:
                          description: ToReplace is the number of resources deleted
                            and recreated.
                          format: int32
                          type: integer
                        toUpdate:
                          description: ToUpdate is the number of resources changed
                            in place.
                          format: int32
                          type: integer
                      type: object
                    lastFlare:
                      description: LastFlare is the last Flare that ran this unit.
                      type: string
                    message:
                      description: Message explains a failed or skipped unit.
                      type: string
                    path:
                      description: Path is the unit directory, relative to the Astral
                        path.
                      type: string
                    result:
                      description: Result is the outcome of the last Flare that ran
                        this unit.
                      enum:
                      - Succeeded
                      - Failed
                      - Skipped
                      - Excluded
                      type: string
                    syncStatus:
                      description: SyncStatus is the unit's own alignment with the
                        tracked revision.
                      enum:
                      - Synced
                      - OutOfSync
                      - Unknown
                      type: string
                  required:
                  - path
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - path
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
