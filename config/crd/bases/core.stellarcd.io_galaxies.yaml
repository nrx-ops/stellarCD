---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: galaxies.core.stellarcd.io
spec:
  group: core.stellarcd.io
  names:
    kind: Galaxy
    listKind: GalaxyList
    plural: galaxies
    shortNames:
    - gal
    - galaxies
    singular: galaxy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.universeRef
      name: Universe
      type: string
    - jsonPath: .spec.terrarium.engine
      name: Engine
      type: string
    - jsonPath: .spec.approvalPolicy
      name: Approval
      type: string
    - jsonPath: .status.astralCount
      name: Astrals
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Galaxy is the Schema for the galaxies API: a logical cluster of Astrals
          orbiting one team, one VCS provider and one state backend.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GalaxySpec defines the desired state of a Galaxy.

              A Galaxy groups Astrals that share a team, a VCS provider, an engine version
              and a state backend. It is the level at which credentials and approval rules
              are set once and inherited downwards.
            properties:
              approvalPolicy:
                default: RequiresReview
                description: ApprovalPolicy decides whether Flares need a human before
                  they run.
                enum:
                - Auto
                - Manual
                - RequiresReview
                type: string
              archived:
                default: false
                description: 'Archived freezes the Galaxy: no new Flare is admitted.'
                type: boolean
              backendConfig:
                description: BackendConfig describes the remote state backend shared
                  by the Astrals.
                properties:
                  bucket:
                    description: Bucket is the S3 bucket or GCS bucket holding the
                      state files.
                    type: string
                  container:
                    description: Container is the Azure Blob container holding the
                      state files.
                    type: string
                  prefix:
                    description: |-
                      Prefix is prepended to every state key, letting one bucket host many
                      Galaxies without collisions.
                    type: string
                  region:
                    description: Region is the cloud region hosting the backend.
                    type: string
                  secretRef:
                    description: |-
                      SecretRef references the Secret holding the backend credentials. Its keys
                      are injected as environment variables into the executor process.
                    properties:
                      name:
                        description: Name is the name of the referenced Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  storageAccount:
                    description: StorageAccount is the Azure Blob storage account.
                    type: string
                  type:
                    description: Type selects the backend implementation.
                    enum:
                    - S3
                    - GCS
                    - AzureBlob
                    type: string
                required:
                - type
                type: object
              defaultVCSProvider:
                default: GitHub
                description: DefaultVCSProvider is inherited by Astrals that do not
                  set their own.
                enum:
                - GitHub
                - GitLab
                - Gitea
                type: string
              defaultVCSURL:
                description: |-
                  DefaultVCSURL is the base URL of the VCS instance, used to build webhook
                  endpoints and to default Astral repositories.
                type: string
              description:
                description: Description explains the scope of this group.
                maxLength: 1024
                type: string
              discovery:
                description: |-
                  Discovery turns a repository into Astrals automatically, instead of
                  declaring each root module by hand.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled turns the routine on. It is off by default: discovery creates
                      objects, and that should be an explicit decision.
                    type: boolean
                  exclude:
                    description: |-
                      Exclude drops modules matching these patterns, and wins over Include.
                      Vendored module libraries usually belong here.
                    items:
                      type: string
                    type: array
                  include:
                    description: |-
                      Include keeps only modules whose directory matches one of these patterns.
                      A pattern matches when it equals the directory, is a parent prefix of it,
                      or matches it as a shell glob. Empty means "every module found".
                    items:
                      type: string
                    type: array
                  interval:
                    description: |-
                      Interval paces the walk. Discovery runs inside the Galaxy's normal
                      reconcile loop but is rate-limited to this interval, so shortening the
                      reconcile period does not multiply calls to the VCS API.
                    type: string
                  maxAstrals:
                    default: 50
                    description: |-
                      MaxAstrals caps how many Astrals one pass may create. It is a guard, not
                      a target: a repository with more matching modules than this reports the
                      overflow on the Discovered condition rather than silently truncating.
                    format: int32
                    maximum: 1000
                    minimum: 1
                    type: integer
                  prune:
                    default: false
                    description: |-
                      Prune deletes previously discovered Astrals whose module has disappeared
                      from the repository. It only ever touches Astrals this Galaxy created,
                      never hand-written ones, and is off by default because deleting an Astral
                      discards its Flare history.
                    type: boolean
                  repository:
                    description: |-
                      Repository is the repository to scan. SecretRef defaults to the Galaxy's
                      vcsSecretRef, and Path scopes the walk to a subtree.
                    properties:
                      branch:
                        default: main
                        description: Branch is the tracked branch.
                        minLength: 1
                        type: string
                      path:
                        default: .
                        description: |-
                          Path is the directory inside the repository holding the root module.
                          Relative to the repository root; "." means the root itself.
                        type: string
                      provider:
                        default: GitHub
                        description: Provider identifies the hosting platform.
                        enum:
                        - GitHub
                        - GitLab
                        - Gitea
                        type: string
                      secretRef:
                        description: |-
                          SecretRef references the Secret holding the clone credentials. When unset
                          the Galaxy-level credentials are used.
                        properties:
                          name:
                            description: Name is the name of the referenced Secret.
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      url:
                        description: URL is the clone URL, HTTPS or SSH.
                        minLength: 1
                        type: string
                    required:
                    - url
                    type: object
                  stripPrefix:
                    description: |-
                      StripPrefix is removed from a module path before its Astral name is
                      derived, which keeps names readable when every module sits under a
                      common directory.
                    type: string
                  template:
                    description: |-
                      Template supplies the fields a discovered Astral cannot infer from the
                      repository layout.
                    properties:
                      applyOnMerge:
                        default: false
                        description: ApplyOnMerge raises an Apply Flare when the tracked
                          branch moves.
                        type: boolean
                      autoApply:
                        default: false
                        description: AutoApply lets a successful Plan chain into an
                          Apply.
                        type: boolean
                      driftDetection:
                        description: DriftDetection configures the periodic Refresh
                          Flares.
                        properties:
                          enabled:
                            default: false
                            description: Enabled turns periodic drift detection on.
                            type: boolean
                          interval:
                            default: 1h
                            description: Interval is the delay between two drift checks.
                            type: string
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: Labels are added to every discovered Astral.
                        type: object
                      planOnPR:
                        default: true
                        description: PlanOnPR raises a Plan Flare when a pull request
                          touches the module.
                        type: boolean
                    type: object
                required:
                - repository
                type: object
              displayName:
                description: DisplayName is the human-readable group name shown in
                  the dashboard.
                maxLength: 128
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels are propagated onto the Astrals of this Galaxy.
                type: object
              teamEmail:
                description: TeamEmail is the distribution list notified about Flares
                  in this Galaxy.
                pattern: ^$|^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$
                type: string
              terrarium:
                description: Terrarium pins the engine and version used across the
                  Galaxy.
                properties:
                  engine:
                    default: Terraform
                    description: Engine is the binary invoked to plan and apply infrastructure.
                    enum:
                    - Terraform
                    - OpenTofu
                    - Terragrunt
                    type: string
                  version:
                    description: |-
                      Version is the exact engine version, e.g. "1.9.5". An empty value means
                      "whatever version the runner image ships".
                    pattern: ^$|^v?[0-9]+\.[0-9]+(\.[0-9]+)?$
                    type: string
                type: object
              universeRef:
                description: |-
                  UniverseRef is the name of the owning Universe. It is immutable: moving a
                  Galaxy between tenants would move its namespace too.
                maxLength: 253
                minLength: 1
                type: string
              vcsSecretRef:
                description: |-
                  VCSSecretRef references the Secret holding the VCS credentials shared by
                  the Astrals of this Galaxy.
                properties:
                  name:
                    description: Name is the name of the referenced Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - universeRef
            type: object
          status:
            description: GalaxyStatus reports the observed state of a Galaxy.
            properties:
              astralCount:
                description: AstralCount is the number of Astrals belonging to this
                  Galaxy.
                format: int32
                type: integer
              backendConfigMap:
                description: |-
                  BackendConfigMap names the ConfigMap holding the rendered backend
                  configuration consumed by the executor.
                type: string
              conditions:
                description: Conditions holds the machine-readable state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discoveredAstrals:
                description: DiscoveredAstrals is how many Astrals the last discovery
                  pass owns.
                format: int32
                type: integer
              flareCount:
                description: FlareCount is the number of Flares belonging to this
                  Galaxy.
                format: int32
                type: integer
              lastDiscoveryTime:
                description: |-
                  LastDiscoveryTime is when the repository was last walked. It is what
                  rate-limits the routine across reconciles.
                format: date-time
                type: string
              lastSync:
                description: LastSync is the time of the last successful reconciliation.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last processed.
                format: int64
                type: integer
              phase:
                description: Phase is a coarse summary of the group state.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
