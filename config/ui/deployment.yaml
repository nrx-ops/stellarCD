apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: system
  labels:
    app: stellarcd-ui
    app.kubernetes.io/name: stellarcd
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stellarcd-ui
  template:
    metadata:
      labels:
        app: stellarcd-ui
    spec:
      containers:
      - name: ui
        image: ui:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        # nginx proxies /api here. The dashboard holds no cluster credentials of
        # its own: the operator's admin API performs every Kubernetes read.
        # The host matches config/manager/admin_api_service.yaml once the
        # "stellarcd-" namePrefix from config/default has been applied.
        - name: ADMIN_API_URL
          value: http://stellarcd-admin-api:8080
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: system
  labels:
    app: stellarcd-ui
    app.kubernetes.io/name: stellarcd
    app.kubernetes.io/component: dashboard
spec:
  type: NodePort
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
    nodePort: 30300
  selector:
    app: stellarcd-ui
